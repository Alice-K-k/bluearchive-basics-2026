    <style>
        /* ====== 沉浸式画廊专属样式 ====== */
        
        /* 画廊网格布局 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 相框卡片 */
        .art-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(20, 20, 20, 0.5); 
            border: 2px solid rgba(135, 206, 235, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.4s ease;
            cursor: pointer;
            aspect-ratio: 4 / 3; /* 卡片比例，如果你的图是竖图，可以改成 3 / 4 */
        }

        /* 鼠标悬浮时的相框发光 */
        .art-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #87CEEB;
            box-shadow: 0 10px 30px rgba(135, 206, 235, 0.6);
        }

        /* 画廊图片 */
        .art-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .art-card:hover img {
            transform: scale(1.1);
        }

        /* 图片上的文字遮罩 */
        .art-info {
            position: absolute;
            bottom: -80px;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 50px 20px 20px 20px;
            box-sizing: border-box;
            transition: all 0.4s ease;
            text-align: center;
        }

        .art-card:hover .art-info {
            bottom: 0;
        }

        .art-info h3 {
            color: #87CEEB;
            margin: 0 0 5px 0;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .art-info p {
            color: #ddd;
            margin: 0;
            font-size: 13px;
        }
    </style>
</head>
